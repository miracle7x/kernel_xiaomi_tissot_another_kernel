name: Build-Treble-KSU-V2

on:
  workflow_dispatch:
  push:
    branches: [ Treble-Non-KSU ]   # sesuaikan dengan branch default repo kamu

env:
  ARCH: arm64
  SUBARCH: arm64
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 5G
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 1
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
  CCACHE_NOHASHDIR: 1
  KBUILD_BUILD_USER: cappuccino
  KBUILD_BUILD_HOST: build
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔥 Telegram Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="🚀 <b>Kernel CI started test</b>%0A%0A<b>Workflow:</b> ${{ github.workflow }}%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Commit:</b> <code>${GITHUB_SHA::7}</code>%0A<b>Run:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">#${{ github.run_number }}</a>"

      - name: 🔄 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: ⚡ Cache Clang
        uses: actions/cache@v4
        with:
          path: clang
          key: ${{ runner.os }}-proton-clang-master

      - name: ⚡ Cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-tissot-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-tissot-

      - name: 🔧 Deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev ccache zip libncurses6
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true

      - name: ⚙ Toolchain
        run: |
          if [ ! -f "clang/bin/clang" ]; then
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          fi
          # Hapus binutils host bawaan proton agar memakai ld/as bawaan sistem
          rm -f clang/bin/ld clang/bin/as

      - name: 🔍 Detect defconfig
        run: |
          if [ -f arch/arm64/configs/tissot_defconfig ]; then
            echo "DEFCONFIG=tissot_defconfig" >> $GITHUB_ENV
          elif [ -f arch/arm64/configs/tissot_defconfig ]; then
            echo "DEFCONFIG=tissot_defconfig" >> $GITHUB_ENV
          else
            echo "Defconfig tissot tidak ditemukan. Isi arch/arm64/configs:"
            ls arch/arm64/configs
            exit 1
          fi

      - name: 🥷 Remove hardcoded build user/host
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          echo "== Sebelum =="
          grep -rnE "KBUILD_BUILD_(USER|HOST)|LINUX_COMPILE_(BY|HOST)=" \
            Makefile arch/*/Makefile scripts/mkcompile_h 2>/dev/null || true

          # 1. Hapus override KBUILD_BUILD_USER/HOST di Makefile utama & arch
          for f in Makefile arch/*/Makefile; do
            [ -f "$f" ] || continue
            sed -i -E '/^[[:space:]]*(override[[:space:]]+)?(export[[:space:]]+)?KBUILD_BUILD_(USER|HOST)[[:space:]]*[:?+]?=/d' "$f"
          done

          # 2. Ganti nilai literal di scripts/mkcompile_h dengan env var
          #    (baris bawaan yang memakai $ atau ( tidak tersentuh)
          f=scripts/mkcompile_h
          if [ -f "$f" ]; then
            sed -i -E 's|^([[:space:]]*)LINUX_COMPILE_BY=[^$(`]+$|\1LINUX_COMPILE_BY="$KBUILD_BUILD_USER"|' "$f"
            sed -i -E 's|^([[:space:]]*)LINUX_COMPILE_HOST=[^$(`]+$|\1LINUX_COMPILE_HOST="$KBUILD_BUILD_HOST"|' "$f"
          fi
          
      - name: 📥 Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s master

      - name: 🛠️ Build 
        run: |
          export PATH="$PWD/clang/bin:$PATH"

          mkdir -p out
          JOBS=$(( $(nproc --all) * 2 ))

          make -j${JOBS} O=out ${DEFCONFIG}
          make -j${JOBS} O=out \
            CC="ccache clang" \
            HOSTCC="ccache gcc" \
            HOSTCXX="ccache g++" \
            Image.gz-dtb

      - name: 📦 Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git anykernel/README.md anykernel/modules anykernel/patch anykernel/ramdisk

          sed -i 's/^kernel.string=.*/kernel.string=perf kernel tissot by cappuccino/' anykernel/anykernel.sh

          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' anykernel/anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=tissot/' anykernel/anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=1/' anykernel/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel/anykernel.sh
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb

          cd anykernel
          zip -r9 ../perf-treble-ksu-tissot-$(date +'%Y%m%d').zip * -x .git README.md *placeholder

      - name: ⬇️ Upload
        uses: actions/upload-artifact@v4
        with:
          name: perf-treble-ksu-tissot
          path: perf-treble-ksu-tissot-*.zip

      - name: ⬇️ Telegram Upload
        run: |
          ZIP=$(ls perf-treble-ksu-tissot-*.zip | head -n1)
          SIZE=$(du -h "$ZIP" | cut -f1)
          curl -s -F document=@"$ZIP" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F parse_mode="HTML" \
            -F caption=$'✅ <b>Kernel CI build success</b>\n\n<b>File:</b> '"$ZIP"$'\n<b>Size:</b> '"$SIZE"$'\n<b>Branch:</b> ${{ github.ref_name }}\n<b>Commit:</b> <code>'"${GITHUB_SHA::7}"$'</code>' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
