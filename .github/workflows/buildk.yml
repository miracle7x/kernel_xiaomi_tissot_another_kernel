name: Kernel CI

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Nama kernel"
        default: "AnotherKernel"
      device:
        description: "Codename device"
        default: "tissot"
      device_alt:
        description: "Codename alternatif (kosongkan jika tidak ada)"
        default: "tissot_sprout"
      defconfig:
        description: "Defconfig (kosongkan = auto-detect <device>_defconfig)"
        default: ""
      slot_device:
        description: "Device A/B (is_slot_device)"
        type: choice
        default: "1"
        options: ["1", "0"]
      boot_block:
        description: "Partisi boot"
        default: "/dev/block/bootdevice/by-name/boot"
      clang_repo:
        description: "Repo toolchain clang"
        default: "https://github.com/kdrag0n/proton-clang.git"
      anykernel_repo:
        description: "Repo AnyKernel3"
        default: "https://github.com/osm0sis/AnyKernel3.git"
      anykernel_branch:
        description: "Branch AnyKernel3 (kosongkan = default)"
        default: ""
      ksu_variant:
        description: "KernelSU variant"
        type: choice
        default: next
        options: [next, tiann, none]
      ksu_hook:
        description: "Mode hook KernelSU"
        type: choice
        default: kprobes
        options: [kprobes, manual]
  push:
    branches: [ master, main ]

env:
  # ===== Konfigurasi (ubah di sini atau lewat input) =====
  KERNEL_NAME: ${{ inputs.kernel_name || 'AnotherKernel' }}
  DEVICE: ${{ inputs.device || 'tissot' }}
  DEVICE_ALT: ${{ inputs.device_alt || 'tissot_sprout' }}
  DEFCONFIG_INPUT: ${{ inputs.defconfig || '' }}
  SLOT_DEVICE: ${{ inputs.slot_device || '1' }}
  BOOT_BLOCK: ${{ inputs.boot_block || '/dev/block/bootdevice/by-name/boot' }}
  CLANG_REPO: ${{ inputs.clang_repo || 'https://github.com/kdrag0n/proton-clang.git' }}
  ANYKERNEL_REPO: ${{ inputs.anykernel_repo || 'https://github.com/osm0sis/AnyKernel3.git' }}
  ANYKERNEL_BRANCH: ${{ inputs.anykernel_branch || '' }}
  KSU_VARIANT: ${{ inputs.ksu_variant || 'next' }}
  KSU_HOOK: ${{ inputs.ksu_hook || 'kprobes' }}
  KSU_NEXT_SETUP: https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh
  KSU_NEXT_REF: next
  KSU_TIANN_SETUP: https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh
  KSU_TIANN_REF: v0.9.5

  # ===== Build =====
  ARCH: arm64
  SUBARCH: arm64
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  KBUILD_BUILD_USER: ${{ github.repository_owner }}
  KBUILD_BUILD_HOST: actions
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 5G
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 1
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
  CCACHE_NOHASHDIR: 1

  # ===== Telegram (dari repository secrets) =====
  TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kernel CI Start (test kirim Telegram)
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true \
            -d text="<b>Kernel CI Build Started</b>
          Kernel: <code>${KERNEL_NAME}</code>
          Device: <code>${DEVICE}</code>
          Branch: <code>${GITHUB_REF_NAME}</code>
          KernelSU: <code>${KSU_VARIANT}</code> (${KSU_HOOK})
          <a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">Lihat run</a>"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup KernelSU
        if: env.KSU_VARIANT != 'none'
        run: |
          if [ "$KSU_VARIANT" = "next" ]; then
            curl -LSs "$KSU_NEXT_SETUP" | bash -s "$KSU_NEXT_REF"
          else
            curl -LSs "$KSU_TIANN_SETUP" | bash -s "$KSU_TIANN_REF"
          fi
          ls drivers | grep -i kernelsu

      - name: Cache Clang
        uses: actions/cache@v4
        with:
          path: clang
          key: ${{ runner.os }}-clang-${{ hashFiles('.github/workflows/**') }}-${{ env.CLANG_REPO }}

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-${{ env.DEVICE }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ env.DEVICE }}-

      - name: Deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev ccache zip libncurses6
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true

      - name: Toolchain
        run: |
          if [ ! -f "clang/bin/clang" ]; then
            git clone --depth=1 "$CLANG_REPO" clang
          fi
          # Hapus binutils host bawaan toolchain agar memakai ld/as sistem
          rm -f clang/bin/ld clang/bin/as

      - name: Detect defconfig
        run: |
          CFG_DIR=arch/${ARCH}/configs
          if [ -n "$DEFCONFIG_INPUT" ]; then
            DEFCONFIG="$DEFCONFIG_INPUT"
          elif [ -f "$CFG_DIR/${DEVICE}_defconfig" ]; then
            DEFCONFIG="${DEVICE}_defconfig"
          elif [ -f "$CFG_DIR/vendor/${DEVICE}_defconfig" ]; then
            DEFCONFIG="vendor/${DEVICE}_defconfig"
          else
            echo "Defconfig untuk ${DEVICE} tidak ditemukan. Isi ${CFG_DIR}:"
            ls "$CFG_DIR"
            exit 1
          fi
          echo "DEFCONFIG=${DEFCONFIG}" >> $GITHUB_ENV

      - name: Remove hardcoded build user/host
        run: |
          echo "== Sebelum =="
          grep -nE 'KBUILD_BUILD_(USER|HOST)|LINUX_COMPILE_(BY|HOST)' Makefile scripts/mkcompile_h || true

          # Hapus assignment KBUILD_BUILD_USER/HOST yang ditulis langsung di Makefile
          sed -i -E '/^[[:space:]]*(export[[:space:]]+)?KBUILD_BUILD_(USER|HOST)[[:space:]]*[:?]?=/d' Makefile

          # Ganti nilai literal di mkcompile_h agar mengikuti env
          sed -i -E 's|^([[:space:]]*)LINUX_COMPILE_BY=["'"'"'][^$"'"'"']*["'"'"']|\1LINUX_COMPILE_BY="${KBUILD_BUILD_USER:-$(whoami)}"|' scripts/mkcompile_h
          sed -i -E 's|^([[:space:]]*)LINUX_COMPILE_HOST=["'"'"'][^$"'"'"']*["'"'"']|\1LINUX_COMPILE_HOST="${KBUILD_BUILD_HOST:-$(hostname)}"|' scripts/mkcompile_h

          echo "== Sesudah =="
          grep -nE 'KBUILD_BUILD_(USER|HOST)|LINUX_COMPILE_(BY|HOST)' Makefile scripts/mkcompile_h || true
          
      - name: Build
        run: |
          export PATH="$PWD/clang/bin:$PATH"

          mkdir -p out
          JOBS=$(( $(nproc --all) * 2 ))

          make -j${JOBS} O=out ${DEFCONFIG}

          if [ "$KSU_VARIANT" != "none" ]; then
            scripts/config --file out/.config -e KSU
            if [ "$KSU_HOOK" = "kprobes" ]; then
              scripts/config --file out/.config -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS -d KSU_MANUAL_HOOK
            else
              scripts/config --file out/.config -e KSU_MANUAL_HOOK
            fi
            make O=out olddefconfig
          fi

          make -j${JOBS} O=out \
            CC="ccache clang" \
            HOSTCC="ccache gcc" \
            HOSTCXX="ccache g++" \
            Image.gz-dtb

          echo "KERNEL_VERSION=$(make -s O=out kernelversion)" >> $GITHUB_ENV

      - name: Package
        run: |
          BRANCH_ARG=""
          [ -n "$ANYKERNEL_BRANCH" ] && BRANCH_ARG="-b $ANYKERNEL_BRANCH"
          git clone --depth=1 $BRANCH_ARG "$ANYKERNEL_REPO" anykernel
          rm -rf anykernel/.git anykernel/README.md anykernel/modules anykernel/patch anykernel/ramdisk

          sed -i "s|^kernel.string=.*|kernel.string=${KERNEL_NAME} ${DEVICE} by ${KBUILD_BUILD_USER}|" anykernel/anykernel.sh
          sed -i 's|^do.devicecheck=.*|do.devicecheck=1|' anykernel/anykernel.sh
          sed -i "s|^device.name1=.*|device.name1=${DEVICE}|" anykernel/anykernel.sh
          if [ -n "$DEVICE_ALT" ]; then
            sed -i "s|^device.name2=.*|device.name2=${DEVICE_ALT}|" anykernel/anykernel.sh
          fi
          sed -i "s|^is_slot_device=.*|is_slot_device=${SLOT_DEVICE}|" anykernel/anykernel.sh
          sed -i "s|^BLOCK=.*|BLOCK=${BOOT_BLOCK};|" anykernel/anykernel.sh

          cp out/arch/${ARCH}/boot/Image.gz-dtb anykernel/Image.gz-dtb

          SUFFIX=""
          [ "$KSU_VARIANT" != "none" ] && SUFFIX="-KSU"
          ZIP_NAME="${KERNEL_NAME}-${DEVICE}${SUFFIX}-$(date +'%Y%m%d').zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          cd anykernel
          zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.DEVICE }}
          path: ${{ env.ZIP_NAME }}

      - name: Telegram - Build Success + Upload
        if: success()
        run: |
          DURATION=$(( $(date +%s) - START_TIME ))
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="HTML" \
            -d text="<b>Kernel CI Test Build Success</b>
          Kernel: <code>${KERNEL_NAME}</code>
          Device: <code>${DEVICE}</code>
          Linux: <code>${KERNEL_VERSION}</code>
          KernelSU: <code>${KSU_VARIANT}</code> (${KSU_HOOK})
          Waktu: <code>$((DURATION / 60)) menit $((DURATION % 60)) detik</code>"

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F chat_id="${TG_CHAT}" \
            -F document=@"${ZIP_NAME}" \
            -F parse_mode="HTML" \
            -F caption="<b>${ZIP_NAME}</b>
          Commit: <code>${GITHUB_SHA::7}</code>"

      - name: Telegram - Build Failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true \
            -d text="<b>Kernel CI Build Failed</b>
          Kernel: <code>${KERNEL_NAME}</code>
          Device: <code>${DEVICE}</code>
          <a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">Lihat log</a>"
